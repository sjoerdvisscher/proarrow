# Kept separate from haskell-ci.yml on purpose: that file is generated by
# `haskell-ci regenerate` from haskell-ci.patch, so edits to it get overwritten.
# Builds and tests proarrow with the `blas` flag, against the system's OpenBLAS.
name: BLAS

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  blas:
    name: BLAS - ghc-9.12.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.12.2'
          # the same cabal as doctest.yml, pinned there for sol/doctest#487
          cabal-version: '3.16.1.0'

      - name: Update package index
        run: cabal update

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: blas-${{ runner.os }}-ghc-9.12.2-${{ hashFiles('proarrow/proarrow.cabal') }}
          restore-keys: blas-${{ runner.os }}-ghc-9.12.2-

      - name: Build
        run: cabal build all --enable-tests -f+blas

      - name: Test
        run: cabal test all -f+blas
