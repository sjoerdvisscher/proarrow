# Kept separate from haskell-ci.yml on purpose: that file is generated by
# `haskell-ci regenerate` from haskell-ci.patch, so edits to it get overwritten.
name: Doctest

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  doctest:
    name: Doctest - ghc-${{ matrix.ghc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.10.3']
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - name: Update package index
        run: cabal update

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: doctest-${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('proarrow.cabal') }}
          restore-keys: doctest-${{ runner.os }}-ghc-${{ matrix.ghc }}-

      # --ignore-project so the install is not constrained by this package's
      # cabal.project / cabal.project.local.
      - name: Install doctest
        run: cabal install doctest --overwrite-policy=always --ignore-project

      - name: Run doctests
        run: bash doctest.sh
